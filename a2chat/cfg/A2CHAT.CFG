HOST=192.168.1.10
PORT=11434
# API is not chosen by the port. Unset, A2CHAT tries OpenAI
# /v1/chat/completions and falls back to Ollama /api/chat on HTTP 404.
# API=OPENAI or API=OLLAMA forces one. API=OLLA uses /olla/ollama/api/...
MODEL=llama3.1
SLOT=0
IP=
GATEWAY=
NETMASK=
PREFIX=
MAXHIST=4096
MAXREAD=4096
MAXWRITE=65535
HISTCAP=32768
# STREAM=1 shows replies word by word, STREAM=0 waits for the whole reply.
# Unset, it is 1 on Uthernet II builds and 0 on CoGS builds.
